name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog python3-matplotlib

      - name: Run the whole flow (fails if any self-check fails)
        run: bash run_demo.sh

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: results/demo_report.html
